name: "✅ Linting"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.12"

jobs:
  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not only the tip, for the secret scan below: at depth 1 a secret added
          # and then removed inside a pull request passes, and a rebase merge lands it on main.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.10"
          extra-args: --all-files --no-group qgis-venv --verbose

      # The commit-time gitleaks hook scans staged changes, and nothing is staged here.
      - name: Scan the commits for secrets
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.9"
          extra-args: --all-files --verbose --hook-stage manual gitleaks-history
