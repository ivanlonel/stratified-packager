name: "⬆️ Post-Renovate Hooks"

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  post-renovate-hooks:
    # Only run on PRs opened by the Renovate GitHub App. Check the PR author from the event
    # payload rather than github.actor, which reflects whoever triggered the latest run
    # (e.g. a re-run or a pushed commit) and is spoofable (zizmor bot-conditions).
    # Renovate's lock file maintenance is never a trigger: that branch is lockfile-only, so
    # Renovate would rebuild it on every run once this job committed to it (the force-push
    # loop #80 hit). The weekly group PR refreshes the whole lock in step 0 instead, and
    # renovate.json disables lockFileMaintenance.
    if: github.event.pull_request.user.login == 'renovate[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'pep621') ||
      contains(github.event.pull_request.labels.*.name, 'pre-commit'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      # artipacked is ignored on the checkout below: this job intentionally persists the
      # checkout credentials so git-auto-commit-action (last step) can push the hook results
      # back to the Renovate PR branch — persist-credentials: false would break that push.
      - name: Checkout PR branch # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the actual PR branch so we can push changes back to it.
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Persist uv's download cache across runs (rolling restore-keys).
          enable-cache: true

      # ── Step 0: refresh the whole lock, on the weekly group PR only ───
      # This stands in for Renovate's lockFileMaintenance. Unlike that lockfile-only branch,
      # this one carries a pyproject.toml bump Renovate leaves alone, so the refresh can sit
      # in this job's commit, and step 1 re-pins every sync-with-uv hook to it in the same
      # commit. Each checker or engine update then runs, and fails, on the PR that brings it.
      # Major-update and security PRs stay focused on their own bump.
      - name: Refresh uv.lock (weekly group PR only)
        if: github.head_ref == 'renovate/pep621-pre-commit'
        run: uv lock --upgrade

      # ── Step 1: apply the dependency-update hooks, in the required order ───
      #   sync-with-uv (reads the uv.lock Renovate updated, refreshed by step 0) → pyproject-fmt.
      #
      # Both run through prek twice: the first pass does the work and is allowed to fail
      # (prek exits 1 merely when it modifies files); the verify pass confirms the result is
      # stable — exit 0 means the first pass succeeded legitimately, exit 1 again means a real
      # error and the workflow fails.
      - name: prek – sync-with-uv (first pass)
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "0.5.6"
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv
        continue-on-error: true

      - name: prek – sync-with-uv (verify)
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "0.5.6"
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv

      # Make sure Renovate didn't upset pyproject-fmt by, e.g., misaligning comments.
      - name: prek – pyproject-fmt (first pass)
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "0.5.6"
          extra-args: --all-files --verbose --hook-stage manual pyproject-fmt
        continue-on-error: true

      - name: prek – pyproject-fmt (verify)
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "0.5.6"
          extra-args: --all-files --verbose --hook-stage manual pyproject-fmt

      # ── Step 2: Commit any hook-generated changes back to the PR branch ───
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(deps): apply post-Renovate hooks"
          # Pin the author (default: github.actor). The run triggered by this job's own push
          # has the RENOVATE_TOKEN owner as actor; if Renovate force-pushed meanwhile, that run
          # commits the hooks onto Renovate's new head under the owner's name, which Renovate
          # doesn't ignore, so it would count the PR as modified and stop rebasing it.
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
