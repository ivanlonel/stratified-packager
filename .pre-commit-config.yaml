default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

default_language_version:
  python: python3.12

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock
        name: uv-lock (frozen)
      - id: uv-sync
        always_run: true
        args:
          - --locked

  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.6.0
    hooks:
      - id: sync-with-uv

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=500
      - id: check-ast
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-toml
      - id: check-yaml
        additional_dependencies:
          - ruamel-yaml==0.19.1  # sync-with-uv
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: name-tests-test
        args:
          - --pytest-test-first
        exclude: (^|/)_[^/]*\.py$ # files starting with an underscore are not test modules

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.164.10
    hooks:
      - id: renovate-config-validator
        args:
          - --strict

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        language: golang
        additional_dependencies:
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1"

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        language: python
        additional_dependencies:
          - mdformat-footnote==0.1.3  # sync-with-uv
          - mdformat-frontmatter==2.1.2  # sync-with-uv
          - mdformat-gfm==1.0.0  # sync-with-uv
          - mdformat-ruff==0.1.3  # sync-with-uv
          - mdformat-toc==0.5.0  # sync-with-uv
          # The engines behind the formatting, pinned so they too change only with uv.lock.
          - markdown-it-py==4.2.0  # sync-with-uv
          - mdit-py-plugins==0.6.1  # sync-with-uv
          - mdurl==0.1.2  # sync-with-uv
          - ruamel-yaml==0.19.1  # sync-with-uv
          - ruff==0.17.1  # sync-with-uv
          - wcwidth==0.9.2  # sync-with-uv

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.3
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args:
          - --fix
          # - --unsafe-fixes
      - id: ruff-format

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        args:
          - --config=.flake8
        language: python
        additional_dependencies:
          - flake8-cognitive-complexity==0.1.0  # sync-with-uv
          - flake8-qgis==2.1.0  # sync-with-uv
          - flake8-rst-docstrings==0.4.0  # sync-with-uv
          - pydoclint[flake8]==0.11.1  # sync-with-uv
          # The checks' engines, pinned so they too change only with uv.lock.
          - cognitive-complexity==1.3.0  # sync-with-uv
          - docstring-parser-fork==0.0.16  # sync-with-uv
          - docutils==0.22.4  # sync-with-uv
          - mccabe==0.7.0  # sync-with-uv
          - pycodestyle==2.15.0  # sync-with-uv
          - pyflakes==4.0.3  # sync-with-uv
          - pygments==2.20.0  # sync-with-uv
          - restructuredtext-lint==2.0.2  # sync-with-uv

  - repo: https://github.com/PyCQA/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        # pylint's inference and import-order engines, pinned so they change only with uv.lock.
        additional_dependencies:
          - astroid==4.3.4  # sync-with-uv
          - isort==8.0.1  # sync-with-uv
          - mccabe==0.7.0  # sync-with-uv

  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run --exact ty
        args:
          - check
          - --fix
        language: system
        pass_filenames: false
        require_serial: true
        types_or:
          - python
          - pyi
        groups:
          - qgis-venv

      - id: mypy
        name: mypy
        entry: uv run --exact mypy
        args:
          - .
          - --show-traceback
        language: system
        pass_filenames: false
        require_serial: true
        types_or:
          - python
          - pyi
        groups:
          - qgis-venv

      - id: update-metadata
        name: Sync metadata.txt version with the latest CHANGELOG.md entry
        entry: uv run --isolated --group pack scripts/update_metadata.py
        language: system
        pass_filenames: false
        files: CHANGELOG.md

      - id: pylupdate
        name: Update translation files
        entry: uv run --isolated --group pack scripts/pylupdate.py
        args:
          - --no-obsolete
          - stratified_packager
          - --ts
          - stratified_packager/resources/i18n/stratified_packager_*.ts
        language: system
        pass_filenames: false
        files: (\.py|\.ui)$

      - id: deptry
        name: deptry
        entry: uv run --exact deptry
        args:
          - .
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
        groups:
          - qgis-venv

ci:
  autoupdate_schedule: quarterly
  # Hooks that need uv-managed envs or the QGIS runtime, unavailable on pre-commit.ci runners.
  skip:
    - uv-lock
    - uv-sync
    - sync-with-uv
    - ty-check
    - mypy
    - pylupdate
    - update-metadata
    - deptry
  submodules: false
